[project]
name = "board-game-collection"
version = "0.1.0"
description = "Personal board game collection catalog, quick-start rules, and setup schematics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs-material>=9.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

